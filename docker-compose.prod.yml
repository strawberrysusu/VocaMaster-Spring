# 운영 스택 (Phase 7 ④, ADR-044) — app + MySQL + Redis 3형제를 한 파일로.
#
# 로컬 리허설:  docker compose -f docker-compose.prod.yml up -d --build   (.env 필요 — .env.example 참고)
# 정리:         docker compose -f docker-compose.prod.yml down            (-v 붙이면 DB 데이터까지 삭제)
#
# 일상 개발은 기존 docker-compose.yml(redis 전용)+bat 그대로 — 이 파일은 배포용.
# name을 분리해 두 스택이 서로를 못 건드린다 (같은 폴더의 compose는 기본적으로 같은 프로젝트로 취급되므로).
name: vocamaster-prod

services:
  app:
    build: .                          # Dockerfile(ADR-043) 3단 빌드 — 기본 프로필 prod
    image: vocamaster:prod
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:8080"      # 로컬 리허설은 .env에서 8083 (8080은 개발 서버가 쓰는 중)
    environment:
      # 시크릿 값은 전부 .env에서 — git에 올라가는 이 파일에는 자리표시만 있다
      DB_URL: "jdbc:mysql://mysql:3306/vocamaster?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8"
      DB_USERNAME: vocamaster         # root가 아니라 앱 전용 계정 (ADR-042 정신)
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis               # 컨테이너 이름이 곧 DNS — 내부 네트워크에서 이름으로 찾는다
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      mysql:
        condition: service_healthy    # MySQL '준비 완료'까지 앱 기동 대기 (기동 레이스 제거)
      redis:
        condition: service_started    # Redis는 fail-open 설계 — '떠 있기만' 하면 충분
    mem_limit: 2g                     # 이미지의 MaxRAMPercentage=75가 이 limit 기준으로 힙을 잡음 (~1.5GB)
    healthcheck:                      # JRE 이미지에 curl이 없어 bash 내장 TCP 연결로 확인 (actuator는 관측 단계에서 승격)
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 40s               # 첫 부팅(Flyway 전체 마이그레이션 포함)은 느릴 수 있어 유예

  mysql:
    image: mysql:8.0                  # 테스트(Testcontainers 8.0.x)와 같은 라인
    restart: unless-stopped
    # 호스트 포트 미개방 — DB는 도커 내부 네트워크 전용 (서버 3306이 인터넷에 안 열림 = 공격 표면 제거)
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: vocamaster
      MYSQL_USER: vocamaster
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql     # 컨테이너를 지워도 데이터는 볼륨에 생존 (백업은 ⑥에서)
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7.2-alpine           # 테스트 컨테이너와 같은 버전 (운영-테스트 동등)
    restart: unless-stopped
    # 호스트 포트 미개방 — 내부 전용
    command: ["redis-server", "--appendonly", "yes"]   # 운영은 영속화 켬 (재시작 시 랭킹·캐시 워밍 생략)
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  mysql-data:
  redis-data:
