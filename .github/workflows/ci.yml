# CI/CD (Phase 7 ①+CD, ADR-041)
# CI: 모든 push/PR에서 전체 테스트(Testcontainers MySQL+Redis) + jar 빌드.
# CD: master 푸시가 테스트를 통과하면(needs: build) 도쿄 서버에 자동 배포 —
#     사람이 손으로 하던 "docker build → save|ssh|load → compose up"을 그대로 기계화.
#     docs만 바뀐 푸시는 배포 생략 (재시작 다운타임 ~40초를 문서 커밋마다 낼 이유 없음)
name: CI/CD

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v5   # v4 deprecation 경고 (2026-08 러너 실측)
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend deps
        run: npm ci --prefix frontend

      - name: Frontend lint (TypeScript 타입 오류 포함)
        run: npm run lint --prefix frontend

      # 운영 compose 문법·필수 변수 검증 — 배포 날이 아니라 매 커밋마다 (더미 값은 검증용일 뿐)
      - name: Compose config check
        env:
          JWT_SECRET: ci-config-check-only
          DB_PASSWORD: ci-config-check-only
          MYSQL_ROOT_PASSWORD: ci-config-check-only
        run: docker compose -f docker-compose.prod.yml config --quiet

      # Windows에서 커밋돼 실행 비트가 없음 (git mode 100644) — 러너에서 부여
      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Test + Build (React 번들 포함 jar)
        run: ./gradlew test bootJar --no-daemon

      - name: Test summary (XML 집계 — failFast 조기 중단 오독 방지)
        if: always()
        run: |
          if ls build/test-results/test/*.xml >/dev/null 2>&1; then
            grep -h -o 'tests="[0-9]*" skipped="[0-9]*" failures="[0-9]*" errors="[0-9]*"' build/test-results/test/*.xml \
              | awk -F'"' '{t+=$2; s+=$4; f+=$6; e+=$8} END {print "tests="t" skipped="s" failures="f" errors="e}'
            echo "--- failed tests ---"
            grep -l "<failure\|<error" build/test-results/test/*.xml | while read x; do
              echo "## $x"
              grep -o 'testcase name="[^"]*"' "$x" | head -20
              grep -o '<failure message="[^"]*"' "$x" | head -5
              grep -o '<error message="[^"]*"' "$x" | head -5
            done
          else
            echo "no test XML — 컴파일/설정 단계 실패"
          fi

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: vocamaster-jar
          path: build/libs/*SNAPSHOT.jar
          retention-days: 7

  deploy:
    needs: build                                  # 테스트 통과 없이는 배포 없음
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: deploy-prod                          # 연속 푸시 시 배포가 겹치지 않게 직렬화
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0                          # push 범위 전체 diff — 마지막 커밋만 보면 "코드+문서" 푸시를 docs-only로 오판 (Codex 검산 8/29)

      - name: 앱 변경 감지 (docs·md만이면 배포 생략)
        id: diff
        run: |
          # push 전체 범위 비교. before가 zero-sha(새 브랜치·force push)면 안전하게 전체를 변경으로 간주
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || echo "$BEFORE" | grep -q '^0*$'; then
            CHANGED=$(git ls-files)
          else
            CHANGED=$(git diff --name-only "$BEFORE" "${{ github.sha }}" 2>/dev/null || git ls-files)
          fi
          echo "$CHANGED"
          if echo "$CHANGED" | grep -qvE '^(docs/|.*\.md$)'; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"; echo "docs-only push — 배포 생략"
          fi

      - name: Docker build (배포용 이미지 — 로컬과 같은 Dockerfile)
        if: steps.diff.outputs.deploy == 'true'
        run: docker build -t vocamaster:prod .

      - name: SSH 키 준비
        if: steps.diff.outputs.deploy == 'true'
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.ORACLE_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: 이미지 전송 + compose 갱신 + 재기동
        if: steps.diff.outputs.deploy == 'true'
        run: |
          SSH="ssh -o StrictHostKeyChecking=accept-new ubuntu@${{ secrets.ORACLE_HOST }}"
          docker save vocamaster:prod | gzip -1 | $SSH 'gunzip | docker load'
          # compose 파일도 매번 동봉 — "서버 compose가 구버전"이던 8/26 사고의 재발 방지
          scp -o StrictHostKeyChecking=accept-new deploy/docker-compose.app.yml ubuntu@${{ secrets.ORACLE_HOST }}:~/
          $SSH 'docker compose -f docker-compose.app.yml up -d'

      - name: 헬스 확인 (healthy 못 되면 배포 실패로 표시)
        if: steps.diff.outputs.deploy == 'true'
        run: |
          ssh -o StrictHostKeyChecking=accept-new ubuntu@${{ secrets.ORACLE_HOST }} '
            for i in $(seq 1 30); do
              st=$(docker inspect -f "{{.State.Health.Status}}" vocamaster-app-app-1 2>/dev/null)
              [ "$st" = "healthy" ] && echo "healthy ✓" && exit 0
              sleep 5
            done
            echo "--- 앱 로그 꼬리 ---"; docker logs --tail 30 vocamaster-app-app-1; exit 1'
