# CI/CD (Phase 7 ①+CD, ADR-041)
# CI: 모든 push/PR에서 전체 테스트(Testcontainers MySQL+Redis) + jar 빌드.
# CD: master 푸시가 테스트를 통과하면(needs: build) 서울 AWS 서버에 앱만 자동 배포 —
#     사람이 손으로 하던 "docker build → save|ssh|load → compose up"을 그대로 기계화.
#     docs만 바뀐 푸시는 배포 생략 (재시작 다운타임 ~40초를 문서 커밋마다 낼 이유 없음)
name: CI/CD

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: '테스트 통과 후 master의 앱을 AWS에 배포'
        type: boolean
        required: true
        default: false
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v5   # v4 deprecation 경고 (2026-08 러너 실측)
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend deps
        run: npm ci --prefix frontend

      - name: Frontend lint (TypeScript 타입 오류 포함)
        run: npm run lint --prefix frontend

      # 운영 compose 문법·필수 변수 검증 — 배포 날이 아니라 매 커밋마다 (더미 값은 검증용일 뿐).
      # 실배포가 쓰는 deploy/docker-compose.app.yml도 함께 — 루트만 검사하던 구멍 (Codex 검산 8/29)
      - name: Compose config check
        env:
          JWT_SECRET: ci-config-check-only
          DB_PASSWORD: ci-config-check-only
          MYSQL_ROOT_PASSWORD: ci-config-check-only
          DB_URL: jdbc:mysql://ci-check:3306/ci
          DB_USERNAME: ci-check
          GOOGLE_CLIENT_ID: ci-check
          GOOGLE_CLIENT_SECRET: ci-check
        run: |
          docker compose -f docker-compose.prod.yml config --quiet
          docker compose -f deploy/docker-compose.app.yml config --quiet
          docker compose -f deploy/docker-compose.aws.yml config --quiet

      # Windows에서 커밋돼 실행 비트가 없음 (git mode 100644) — 러너에서 부여
      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: AWS 배포 스크립트 문법 검사
        run: python3 -m py_compile deploy/deploy-aws.py

      - name: Test + Build (React 번들 포함 jar)
        run: ./gradlew test bootJar --no-daemon

      - name: Test summary (XML 집계 — failFast 조기 중단 오독 방지)
        if: always()
        run: |
          if ls build/test-results/test/*.xml >/dev/null 2>&1; then
            grep -h -o 'tests="[0-9]*" skipped="[0-9]*" failures="[0-9]*" errors="[0-9]*"' build/test-results/test/*.xml \
              | awk -F'"' '{t+=$2; s+=$4; f+=$6; e+=$8} END {print "tests="t" skipped="s" failures="f" errors="e}'
            echo "--- failed tests ---"
            grep -l "<failure\|<error" build/test-results/test/*.xml | while read x; do
              echo "## $x"
              grep -o 'testcase name="[^"]*"' "$x" | head -20
              grep -o '<failure message="[^"]*"' "$x" | head -5
              grep -o '<error message="[^"]*"' "$x" | head -5
            done
          else
            echo "no test XML — 컴파일/설정 단계 실패"
          fi

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: vocamaster-jar
          path: build/libs/*SNAPSHOT.jar
          retention-days: 7

  deploy:
    needs: build
    if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: deploy-prod
      queue: max                                 # docs push가 대기 중인 앱 배포를 취소하지 않게 유지
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 실행 코드 변경 감지 (CI·운영·문서 변경만이면 배포 생략)
        id: diff
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          FORCE_DEPLOY: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy }}
        run: |
          if [ -z "$BEFORE" ] || echo "$BEFORE" | grep -q '^0*$'; then
            CHANGED=$(git ls-files)
          else
            CHANGED=$(git diff --name-only "$BEFORE" "$AFTER" 2>/dev/null || git ls-files)
          fi
          printf '%s\n' "$CHANGED"
          # CI/deploy-only migration commits must leave the restored production JAR intact.
          # Test-only edits still run the build job without restarting production.
          APP_CHANGED=$(printf '%s\n' "$CHANGED" | grep -vE '(^docs/|\.md$)' | grep -E '^(src/main/|frontend/|Dockerfile$|\.dockerignore$|build\.gradle$|settings\.gradle$|gradle/|gradlew$|gradlew\.bat$)' || true)
          if [ "$FORCE_DEPLOY" = 'true' ] || [ -n "$APP_CHANGED" ]; then
            echo 'deploy=true' >> "$GITHUB_OUTPUT"
          else
            echo 'deploy=false' >> "$GITHUB_OUTPUT"
            echo '앱 실행 코드 변경 없음 — 배포 생략'
          fi

      - name: Docker build (서버와 같은 amd64, 커밋별 불변 이미지)
        if: steps.diff.outputs.deploy == 'true'
        run: |
          docker build --platform linux/amd64 \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            -t "vocamaster:$GITHUB_SHA" .
          docker save "vocamaster:$GITHUB_SHA" | gzip -1 > "$RUNNER_TEMP/vocamaster-image.tar.gz"
          sha256sum "$RUNNER_TEMP/vocamaster-image.tar.gz" | cut -d ' ' -f1 > "$RUNNER_TEMP/vocamaster-image.sha256"

      - name: SSH 키와 고정 호스트키 준비
        if: steps.diff.outputs.deploy == 'true'
        env:
          AWS_SSH_KEY: ${{ secrets.AWS_SSH_KEY }}
          AWS_SSH_KNOWN_HOSTS: ${{ vars.AWS_SSH_KNOWN_HOSTS }}
        run: |
          test -n "$AWS_SSH_KEY"
          test -n "$AWS_SSH_KNOWN_HOSTS"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$AWS_SSH_KEY" > ~/.ssh/vocamaster_aws
          printf '%s\n' "$AWS_SSH_KNOWN_HOSTS" > ~/.ssh/vocamaster_aws_known_hosts
          chmod 600 ~/.ssh/vocamaster_aws ~/.ssh/vocamaster_aws_known_hosts

      - name: 이미지 전송 및 앱만 갱신 (실패 시 직전 이미지로 앱 롤백)
        if: steps.diff.outputs.deploy == 'true'
        env:
          AWS_HOST: ${{ secrets.AWS_HOST }}
        run: |
          set -euo pipefail
          # Host and generated paths are validated before use in the remote shell.
          [[ "$AWS_HOST" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$GITHUB_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$GITHUB_RUN_ATTEMPT" =~ ^[0-9]+$ ]]
          REMOTE="/home/ubuntu/vocamaster-aws/incoming/$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          CHECKSUM=$(cat "$RUNNER_TEMP/vocamaster-image.sha256")
          [[ "$CHECKSUM" =~ ^[a-f0-9]{64}$ ]]
          SSH_OPTS=(-i "$HOME/.ssh/vocamaster_aws" -o BatchMode=yes -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$HOME/.ssh/vocamaster_aws_known_hosts")
          assert_current_master() {
            local latest_master latest_sha ancestor_status changed_since_release non_doc_changes
            if ! latest_master=$(git ls-remote --exit-code origin refs/heads/master); then
              echo 'master 현재 커밋 확인 실패 — 배포 중단' >&2
              exit 1
            fi
            if [[ ! "$latest_master" =~ ^([a-f0-9]{40})[[:space:]]+refs/heads/master$ ]]; then
              echo 'master 조회 결과 검증 실패 — 배포 중단' >&2
              exit 1
            fi
            latest_sha="${BASH_REMATCH[1]}"
            if [ "$latest_sha" = "$GITHUB_SHA" ]; then
              return 0
            fi
            # A separate docs-only push must not erase a still-pending app deployment.
            # Fetch the exact observed commit, never compare against a moving ref.
            if ! git fetch --no-tags origin "$latest_sha"; then
              echo '최신 master 커밋 fetch 실패 — 배포 중단' >&2
              exit 1
            fi
            if ! git cat-file -e "$latest_sha^{commit}"; then
              echo '최신 master 커밋 확인 실패 — 배포 중단' >&2
              exit 1
            fi
            if git merge-base --is-ancestor "$GITHUB_SHA" "$latest_sha"; then
              :
            else
              ancestor_status=$?
              if [ "$ancestor_status" -eq 1 ]; then
                echo 'master 이력이 달라 이전 실행의 앱 배포 생략'
                exit 0
              fi
              echo 'master 이력 확인 실패 — 배포 중단' >&2
              exit 1
            fi
            if ! changed_since_release=$(git diff --name-only "$GITHUB_SHA" "$latest_sha" --); then
              echo '최신 master 변경 확인 실패 — 배포 중단' >&2
              exit 1
            fi
            non_doc_changes=$(printf '%s\n' "$changed_since_release" | grep -vE '^($|docs/|.*\.md$)' || true)
            if [ -n "$non_doc_changes" ]; then
              echo '최신 master에 문서 외 변경이 있어 이전 실행의 앱 배포 생략'
              exit 0
            fi
            echo '최신 master는 문서만 변경됨 — 같은 실행 코드의 배포 계속'
          }
          # Slow builds must not replace a newer commit that has already been deployed.
          assert_current_master
          ssh "${SSH_OPTS[@]}" "ubuntu@$AWS_HOST" "umask 077; mkdir -p '$REMOTE'"
          scp "${SSH_OPTS[@]}" "$RUNNER_TEMP/vocamaster-image.tar.gz" "ubuntu@$AWS_HOST:$REMOTE/image.tar.gz"
          scp "${SSH_OPTS[@]}" deploy/deploy-aws.py "ubuntu@$AWS_HOST:$REMOTE/deploy-aws.py"
          # Recheck immediately before the SSH command that can replace the app.
          assert_current_master
          ssh "${SSH_OPTS[@]}" "ubuntu@$AWS_HOST" \
            "python3 '$REMOTE/deploy-aws.py' --release '$GITHUB_SHA' --archive '$REMOTE/image.tar.gz' --sha256 '$CHECKSUM'"

      - name: 러너의 접속 키 정리
        if: always()
        run: rm -f ~/.ssh/vocamaster_aws ~/.ssh/vocamaster_aws_known_hosts
