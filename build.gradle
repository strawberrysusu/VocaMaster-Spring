plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.16'   // 3.3.x는 OSS 지원 종료(보안 패치 중단) → 패치가 나오는 3.5 최신으로 (Phase 7 ②)
    id 'io.spring.dependency-management' version '1.1.5'
}

group = 'com.vocamaster'
version = '0.0.1-SNAPSHOT'

java {
    sourceCompatibility = '17'
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'   // 구글 로그인 (ADR-047)
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // MySQL
    runtimeOnly 'com.mysql:mysql-connector-j'

    // Flyway (DB schema migration)
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-mysql'

    // JWT
    implementation 'io.jsonwebtoken:jjwt-api:0.12.7'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.7'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.7'

    // Redis (Phase 5) — Lettuce 기반 (starter 기본), rate limit / 랭킹 / 캐시
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'

    // Swagger
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.17'   // Boot 3.4/3.5 호환 라인

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // Test
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'

    // Testcontainers (ADR-025) — 운영 동등 MySQL로 통합 테스트
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:mysql'
}

tasks.named('test') {
    useJUnitPlatform()
    failFast = !project.hasProperty('noFailFast')   // 기본: 첫 fail 즉시 중단. -PnoFailFast = 전체 명단 수집(의존성 상향 등)
}

// ── React 번들을 jar에 묶기 (Codex 전수 감사 2026-08-23) ──
// 산출물(src/main/resources/static/app)은 git에 없다 → 깨끗한 clone·CI에서 bootJar만 돌리면 /app 화면이 빠진 jar가 나온다.
// 그래서 processResources 전에 npm build. 입력/출력을 선언해 소스가 그대로면 Gradle이 건너뛴다(up-to-date).
// 끄기: -PskipFrontend (API만 빠르게 빌드할 때)
def frontendDir = file('frontend')
tasks.register('frontendBuild', Exec) {
    description = 'React(Vite) 빌드 → src/main/resources/static/app'
    onlyIf { !project.hasProperty('skipFrontend') && frontendDir.exists() }
    workingDir frontendDir
    inputs.files(fileTree(dir: 'frontend/src'), 'frontend/index.html', 'frontend/package.json',
                 'frontend/package-lock.json', 'frontend/vite.config.ts', 'frontend/tsconfig.json')
    outputs.dir('src/main/resources/static/app')
    def npm = System.getProperty('os.name').toLowerCase().contains('windows') ? 'npm.cmd' : 'npm'
    commandLine npm, 'run', 'build'
}
tasks.named('processResources') { dependsOn 'frontendBuild' }

// CI(UTC 러너) 재현용: gradlew test -Putc — 시간대 기인 실패를 로컬에서 잡는다
tasks.named('test') {
    if (project.hasProperty('utc')) {
        jvmArgs '-Duser.timezone=UTC'
    }
}
