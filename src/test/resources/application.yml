spring:
  # datasource: ← AbstractIntegrationTest의 @ServiceConnection이 동적 주입 (Testcontainers, ADR-025)

  jpa:
    hibernate:
      ddl-auto: validate          # Flyway가 스키마 관리, JPA는 검증만 (운영과 동일)
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  # main의 Redis 키와 짝 맞춤 (알려진 함정: main에만 키 추가 시 PropertyPlaceholder 폭발).
  # Redis가 필요한 테스트는 Testcontainers로 host/port를 덮어씀 — 기본값은 '연결 실패' 경로 검증용
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 300ms
      connect-timeout: 300ms

jwt:
  secret: test-secret-key-minimum-32-characters-long-for-test
  access-expiration: 3600000
  refresh-expiration: 1209600000

server:
  port: 0

auth:
  cookie:
    secure: false
    same-site: Lax
