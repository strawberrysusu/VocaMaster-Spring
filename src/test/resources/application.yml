spring:
  # datasource: ← AbstractIntegrationTest의 @ServiceConnection이 동적 주입 (Testcontainers, ADR-025)

  jpa:
    open-in-view: false           # main과 짝 맞춤 — 테스트도 OSIV 없는 운영 조건으로 돈다
    hibernate:
      ddl-auto: validate          # Flyway가 스키마 관리, JPA는 검증만 (운영과 동일)
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  # main과 짝 맞춤 — 기본 계정 자동 구성 제외
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

  # main의 Redis 키와 짝 맞춤 (알려진 함정: main에만 키 추가 시 PropertyPlaceholder 폭발).
  # Redis가 필요한 테스트는 Testcontainers로 host/port를 덮어씀 — 기본값은 '연결 실패' 경로 검증용
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 300ms
      connect-timeout: 300ms

jwt:
  secret: test-secret-key-minimum-32-characters-long-for-test
  access-expiration: 3600000
  refresh-expiration: 1209600000

server:
  port: 0

auth:
  cookie:
    secure: false
    same-site: Lax

# 기본 off — 로그인 실패를 반복하는 기존 테스트들이 공용 dev Redis에 잠금을 남기면
# 다른 테스트/데모 계정이 잠긴다. rate limit 자체를 검증하는 테스트만 켠다 (@TestPropertySource)
ratelimit:
  login:
    enabled: false

# 기본 off — 켜져 있으면 기존 덱 테스트들의 popular 조회가 dev Redis(6379)에 재구축을 일으켜
# 테스트 데이터 id로 오염시킨다. 랭킹 검증 테스트만 전용 컨테이너와 함께 켠다
ranking:
  popular:
    enabled: false

# 기본 off — 켜져 있으면 리뷰/퀴즈 테스트의 recordStudy·getTodaySummary가 dev Redis를 건드린다
cache:
  review-summary:
    enabled: false
