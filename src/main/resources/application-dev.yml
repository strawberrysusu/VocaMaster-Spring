spring:
  datasource:
    url: jdbc:mysql://localhost:3306/vocamaster?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: root
    password: 1234
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate    # Flyway가 스키마 관리, JPA는 검증만
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  # Redis (Phase 5) — docker compose up -d 로 기동
  # timeout이 짧은 이유: Redis 장애 시 로그인 응답이 늘어지면 안 됨 (fail-open 설계)
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 300ms
      connect-timeout: 300ms

jwt:
  secret: vocamaster-dev-secret-key-minimum-32-characters-long

ratelimit:
  login:
    enabled: true       # 긴급 시 끄는 킬 스위치 (Redis 장애는 코드가 fail-open으로 자동 처리)

ranking:
  popular:
    enabled: true       # off면 인기 정렬이 DB 경로로만 동작
