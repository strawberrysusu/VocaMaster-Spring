spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}     # 기본값 있음 — Redis 미구성 배포에서도 부팅은 되고, fail-open으로 동작
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 300ms
      connect-timeout: 300ms

jwt:
  secret: ${JWT_SECRET}

# 운영에서 API 명세 비공개 (Phase 7 ② 보안 게이트) — 엔드포인트 자체가 등록 안 돼 404
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

ratelimit:
  login:
    enabled: true

ranking:
  popular:
    enabled: true

cache:
  review-summary:
    enabled: true

auth:
  cookie:
    secure: true
    same-site: Strict