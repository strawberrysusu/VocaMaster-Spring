spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  # OSIV off — DB 커넥션을 뷰 렌더까지 붙들지 않는다 (Phase 7 ② 보안 게이트).
  # 서비스 계층이 트랜잭션 안에서 필요한 걸 다 조회하는 설계라 뷰의 lazy 로딩 의존이 없음
  jpa:
    open-in-view: false

  # JWT 전용 인증이라 스프링의 자동 생성 기본 계정(generated password 로그)은 노이즈만 됨
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

jwt:
  access-expiration: 3600000      # 1시간 (밀리초)
  refresh-expiration: 1209600000  # 14일 (밀리초)

server:
  port: 8080
  forward-headers-strategy: framework   # nginx 뒤에서 OAuth redirect_uri가 https로 생성되게 (X-Forwarded-Proto 신뢰)
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

# 구글 OAuth (ADR-047) — 키가 비어 있으면 기능 자체가 꺼짐 (로컬 dev 기본·테스트).
# @Value는 relaxed binding이 없어 환경변수를 yml로 다리 놓아야 한다
google:
  client-id: ${GOOGLE_CLIENT_ID:}
  client-secret: ${GOOGLE_CLIENT_SECRET:}

springdoc:
  swagger-ui:
    path: /api-docs

auth:
  cookie:
    secure: false
    same-site: Lax